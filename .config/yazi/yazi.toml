[opener]
archive = [
  { run = 'unar %s1', desc = "Extract here" },
]
text = [
  { run = 'nvim %s', block = true, desc = "Edit in Neovim" },
]
markdown = [
  { run = 'glow -p %s', block = true, desc = "View with Glow" },
  { run = 'nvim %s', block = true, desc = "Edit in Neovim" },
]

[open]
rules = [
  { url = "*.{md,markdown}", use = "markdown" },
  { mime = "application/zip", use = "archive" },
  { mime = "application/x-rar*", use = "archive" },
  { mime = "application/x-7z*", use = "archive" },
  { mime = "application/x-tar", use = "archive" },
  { mime = "application/gzip", use = "archive" },
  { mime = "application/x-bzip*", use = "archive" },
  { mime = "application/x-xz", use = "archive" },
  { mime = "text/*", use = "text" },
  { mime = "application/json", use = "text" },
  { mime = "application/toml", use = "text" },
  { mime = "application/xml", use = "text" },
  { mime = "application/qml", use = "text" },
]
