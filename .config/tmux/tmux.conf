unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g mouse on              # wheel scrolling in less/glow, click to select panes

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
# --- Windows as tabs along the top ---
set -g status on
set -g status-position top
set -g status-justify left
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left ""
set -g status-right "#S  %H:%M"
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g window-status-style "bg=#313244,fg=#a6adc8"
set -g window-status-current-style "bg=#89b4fa,fg=#1e1e2e,bold"
set -g window-status-separator " "
set -g base-index 1          # number tabs from 1
setw -g pane-base-index 1
set -g renumber-windows on   # close a tab, numbers re-pack
set -g automatic-rename on

# Alt+1..9 jumps to tab; Alt+Left/Right cycles (no prefix needed)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-Left previous-window
bind -n M-Right next-window
# Reopen new tabs in the current directory
bind c new-window -c "#{pane_current_path}"

run '~/.tmux/plugins/tpm/tpm'
